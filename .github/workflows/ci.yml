name: CI
on:
  pull_request:
  push:
    branches: [main, codex/refactor-blue-team-intelligence-pipeline]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout # actions/checkout@v4
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup Python # actions/setup-python@v5
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy
        run: mypy src
      - name: Pytest with coverage
        run: pytest
      - name: Offline fixture report
        run: python -m cyberdailylog run --offline-fixtures --output-dir tmp/reports
      - name: Validate generated report
        run: python -m cyberdailylog validate --output-dir tmp/reports
      - name: JSON schema validation
        run: python - <<'PY'
import json, jsonschema
jsonschema.validate(json.load(open('tmp/reports/latest.json')), json.load(open('schemas/intelligence-item.schema.json')))
PY
      - name: Lightweight secret and policy scan
        run: |
          bad1="AZFREE""2025"; bad2="Free"" Cloud"; ! rg -n "$bad1|$bad2" src README.md config docs && ! rg -n "git push" src
      - name: Dependency audit
        run: python -m pip_audit || echo "pip-audit unavailable in this environment"

name: CI
"on":
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["ops/scheduler/request.json"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout # actions/checkout@v7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Setup Python # actions/setup-python@v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy
        run: mypy src
      - name: Pytest with coverage
        run: pytest
      - name: Offline fixture report
        run: python -m cyberdailylog run --offline-fixtures --output-dir tmp/reports
      - name: Generate fixture portfolio feed
        run: |
          python -m cyberdailylog.portfolio_feed \
            --report tmp/reports/latest.json \
            --output tmp/reports/portfolio-feed.json
      - name: Generate fixture README snapshot
        run: |
          cp README.md tmp/README.md
          python -m cyberdailylog.readme_snapshot \
            --feed tmp/reports/portfolio-feed.json \
            --readme tmp/README.md
      - name: Validate generated report
        run: python -m cyberdailylog validate --output-dir tmp/reports
      - name: JSON and public-output validation
        run: |
          python - <<'PY'
          import json
          from importlib.resources import files
          from pathlib import Path

          import jsonschema

          report = json.loads(Path("tmp/reports/latest.json").read_text(encoding="utf-8"))
          report_schema = json.loads(
              files("cyberdailylog")
              .joinpath("schemas/intelligence-item.schema.json")
              .read_text(encoding="utf-8")
          )
          jsonschema.validate(report, report_schema)

          feed = json.loads(Path("tmp/reports/portfolio-feed.json").read_text(encoding="utf-8"))
          feed_schema = json.loads(
              files("cyberdailylog")
              .joinpath("schemas/portfolio-feed.schema.json")
              .read_text(encoding="utf-8")
          )
          jsonschema.validate(feed, feed_schema, format_checker=jsonschema.FormatChecker())
          assert feed["schema_version"] == 1
          assert feed["project"] == "CyberDailyLog"
          assert feed["qualified_developments"] == len(report["items"])
          assert len(feed["top_vulnerabilities"]) <= 5
          assert all(0 <= item["priority_score"] <= 10 for item in feed["top_vulnerabilities"])

          readme = Path("tmp/README.md").read_text(encoding="utf-8")
          assert "<!-- CYBERDAILYLOG:DAILY:START -->" in readme
          assert feed["generated_at"] in readme
          PY
      - name: Build wheel
        run: python -m build
      - name: Installed wheel smoke test
        run: |
          python -m venv /tmp/cyberdailylog-wheel-test
          /tmp/cyberdailylog-wheel-test/bin/python -m pip install --upgrade pip
          /tmp/cyberdailylog-wheel-test/bin/python -m pip install dist/*.whl
          /tmp/cyberdailylog-wheel-test/bin/python -m cyberdailylog run \
            --offline-fixtures \
            --config-dir "$PWD/config" \
            --output-dir /tmp/cyberdailylog-wheel-reports
          /tmp/cyberdailylog-wheel-test/bin/python -m cyberdailylog validate \
            --output-dir /tmp/cyberdailylog-wheel-reports
          /tmp/cyberdailylog-wheel-test/bin/python -m cyberdailylog.portfolio_feed \
            --report /tmp/cyberdailylog-wheel-reports/latest.json \
            --output /tmp/cyberdailylog-wheel-reports/portfolio-feed.json
          /tmp/cyberdailylog-wheel-test/bin/python -c \
            "from importlib.resources import files; assert files('cyberdailylog').joinpath('schemas/portfolio-feed.schema.json').is_file()"
          cp README.md /tmp/cyberdailylog-wheel-README.md
          /tmp/cyberdailylog-wheel-test/bin/python -m cyberdailylog.readme_snapshot \
            --feed /tmp/cyberdailylog-wheel-reports/portfolio-feed.json \
            --readme /tmp/cyberdailylog-wheel-README.md
          test -f /tmp/cyberdailylog-wheel-reports/latest.md
          test -f /tmp/cyberdailylog-wheel-reports/latest.json
          test -f /tmp/cyberdailylog-wheel-reports/source-health.json
          test -s /tmp/cyberdailylog-wheel-reports/portfolio-feed.json
          grep -q "CYBERDAILYLOG:DAILY:START" /tmp/cyberdailylog-wheel-README.md
      - name: Lightweight secret and policy scan
        run: |
          bad1="AZFREE""2025"; bad2="Free"" Cloud"; ! rg -n "$bad1|$bad2" src README.md config docs && ! rg -n "git push" src
      - name: Dependency audit
        run: python -m pip_audit -r requirements.txt -r requirements-dev.txt
  dashboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout # actions/checkout@v7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Setup Node.js # actions/setup-node@v6.0.0
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dashboard dependencies
        run: npm ci
      - name: Dashboard lint
        run: npm run lint
      - name: Dashboard privacy and production tests
        run: npm test
      - name: Dashboard TypeScript check with Worker runtime types
        run: npm run typecheck
      - name: Dashboard production dependency audit
        run: npm audit --omit=dev --audit-level=high

  artifact-transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Generate secret-free transport fixture
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('artifact-source')
          root.mkdir()
          (root / 'sample.json').write_text('{"purpose":"artifact integrity regression"}\n')
          (root / 'sample.bin').write_bytes(bytes(range(256)) * 16)
          manifest = {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in root.iterdir()}
          (root / 'SHA256SUMS.json').write_text(json.dumps(manifest, sort_keys=True))
          PY
      - name: Upload transport fixture # actions/upload-artifact@v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: action-pin-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifact-source/
          if-no-files-found: error
          retention-days: 1
      - name: Download into a separate directory # actions/download-artifact@v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: action-pin-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifact-received
          digest-mismatch: error
      - name: Verify complete transferred bytes
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          source, received = Path('artifact-source'), Path('artifact-received')
          assert {p.name for p in received.iterdir()} == {'sample.json', 'sample.bin', 'SHA256SUMS.json'}
          assert (source / 'SHA256SUMS.json').read_bytes() == (received / 'SHA256SUMS.json').read_bytes()
          for name, expected in json.loads((received / 'SHA256SUMS.json').read_text()).items():
              assert hashlib.sha256((received / name).read_bytes()).hexdigest() == expected
              assert (received / name).read_bytes() == (source / name).read_bytes()
          print('Artifact upload/download preserved the complete byte fixture.')
          PY

name: Ruff Format Preview

"on":
  pull_request:

permissions:
  contents: read

jobs:
  format-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Ruff
        run: python -m pip install ruff==0.12.10
      - name: Generate formatting patch
        run: |
          ruff format .
          git diff --binary > ruff-format.patch
          test -s ruff-format.patch
      - name: Upload formatting patch
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ruff-format-${{ github.run_id }}
          path: ruff-format.patch
          if-no-files-found: error
          retention-days: 1

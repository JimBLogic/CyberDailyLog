name: Daily Blue Team Intelligence
"on":
  schedule:
    - cron: "0 12 * * *"
      timezone: "Europe/Madrid"
    - cron: "30 13 * * *"
      timezone: "Europe/Madrid"
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: Lookback hours
        required: true
        default: "24"
      dry_run:
        description: Preview only; generate and upload reports without publishing
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: cyberdailylog-daily
  cancel-in-progress: false
jobs:
  preflight:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.freshness.outputs.should_run }}
      reason: ${{ steps.freshness.outputs.reason }}
    steps:
      - name: Checkout # actions/checkout@v7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Check daily publication freshness
        id: freshness
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          should_run="true"
          reason="manual dispatch requested"

          if [ "$EVENT_NAME" = "schedule" ]; then
            today="$(TZ=Europe/Madrid date +%F)"
            published_date="$(
              python scripts/publication_date.py \
                2>/dev/null || true
            )"

            if [ "$published_date" = "$today" ]; then
              should_run="false"
              reason="a report is already published for $today"
            else
              reason="latest report date is ${published_date:-missing}; collection is required for $today"
            fi
          fi

          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          {
            echo "### Daily automation preflight"
            echo "- Collect: \`$should_run\`"
            echo "- Reason: $reason"
          } >> "$GITHUB_STEP_SUMMARY"
  collect:
    needs: preflight
    if: ${{ needs.preflight.outputs.should_run == 'true' }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      dry_run: ${{ steps.mode.outputs.dry_run }}
    steps:
      - name: Checkout # actions/checkout@v7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Setup Python # actions/setup-python@v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Resolve execution mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_LOOKBACK_HOURS: ${{ inputs.lookback_hours }}
        run: |
          set -euo pipefail
          lookback_hours="${INPUT_LOOKBACK_HOURS:-24}"
          case "$lookback_hours" in
            ''|*[!0-9]*) echo "lookback_hours must be a positive integer" >&2; exit 2 ;;
          esac
          if [ "$lookback_hours" -le 0 ] || [ "$lookback_hours" -gt 168 ]; then
            echo "lookback_hours must be a positive integer" >&2
            exit 2
          fi
          if [ "$EVENT_NAME" = "schedule" ]; then
            dry_run="false"
          elif [ "$INPUT_DRY_RUN" = "true" ]; then
            dry_run="true"
          elif [ "$INPUT_DRY_RUN" = "false" ]; then
            dry_run="false"
          else
            echo "dry_run must resolve to true or false" >&2
            exit 2
          fi
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"
          echo "lookback_hours=$lookback_hours" >> "$GITHUB_OUTPUT"
      - name: Install application
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Run collection
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          LOOKBACK_HOURS: ${{ steps.mode.outputs.lookback_hours }}
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            python -m cyberdailylog run --lookback-hours "$LOOKBACK_HOURS"
          else
            python -m cyberdailylog run --lookback-hours "$LOOKBACK_HOURS" --fail-on-degraded
          fi
      - name: Generate compact portfolio feed
        run: python -m cyberdailylog.portfolio_feed
      - name: Generate dashboard history feed
        run: python -m cyberdailylog.dashboard_feed
      - name: Update repository landing snapshot
        run: python -m cyberdailylog.readme_snapshot
      - name: Validate reports
        run: python -m cyberdailylog validate
      - name: Validate public outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          feed = json.loads(Path("reports/portfolio-feed.json").read_text(encoding="utf-8"))
          dashboard = json.loads(Path("reports/dashboard-feed.json").read_text(encoding="utf-8"))
          assert feed["schema_version"] == 1
          assert feed["schema_url"].endswith("schemas/portfolio-feed.schema.json")
          assert feed["endpoints"]["schema"] == feed["schema_url"]
          assert feed["project"] == "CyberDailyLog"
          assert feed["pipeline_status"] in {"operational", "degraded"}
          assert len(feed["top_vulnerabilities"]) <= 5
          assert all(0 <= item["priority_score"] <= 10 for item in feed["top_vulnerabilities"])
          assert dashboard["schema_version"] == 1
          assert dashboard["project"] == "CyberDailyLog"
          assert dashboard["generated_at"] == feed["generated_at"]
          assert 1 <= len(dashboard["history"]) <= 30
          assert dashboard["history"][-1]["date"] == feed["generated_at"][:10]

          readme = Path("README.md").read_text(encoding="utf-8")
          assert "<!-- CYBERDAILYLOG:DAILY:START -->" in readme
          assert feed["generated_at"] in readme
          PY
      - name: Show source health
        run: cat reports/source-health.json
      - name: Upload generated outputs # actions/upload-artifact@v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reports-${{ github.run_id }}
          path: |
            README.md
            reports/
          if-no-files-found: error
          retention-days: 7
  publish:
    outputs:
      commit_sha: ${{ steps.publication.outputs.commit_sha }}
      commit_created: ${{ steps.publication.outputs.commit_created }}
      push_completed: ${{ steps.publication.outputs.push_completed }}
    needs: collect
    if: ${{ needs.collect.outputs.dry_run == 'false' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout main # actions/checkout@v7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: main
      - name: Download generated outputs # actions/download-artifact@v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: reports-${{ github.run_id }}
          path: .
      - name: Commit and push generated outputs
        id: publication
        run: |
          set -euo pipefail
          # Regenerate only the dynamic block against the current README.
          # The collection artifact may predate an intervening documentation edit.
          git restore --source=HEAD -- README.md
          python src/cyberdailylog/readme_snapshot.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md reports

          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi

          git commit -m "intel: publish daily blue team digest [skip ci]"
          git push
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "commit_created=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
          echo "push_completed=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

  timing:
    name: Publication timing evidence
    needs: [preflight, collect, publish]
    if: ${{ always() }}
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download this run's reports
        if: ${{ needs.collect.result == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: reports-${{ github.run_id }}
          path: timing-input
      - name: Read workflow timing from GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > workflow-run.json
      - name: Calculate publication lag
        if: ${{ always() }}
        env:
          TRIGGER_CRON: ${{ github.event.schedule }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          COLLECT_RESULT: ${{ needs.collect.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          DRY_RUN: ${{ needs.collect.outputs.dry_run }}
          COMMIT_SHA: ${{ needs.publish.outputs.commit_sha }}
          COMMIT_CREATED: ${{ needs.publish.outputs.commit_created }}
          PUSH_COMPLETED: ${{ needs.publish.outputs.push_completed }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          def read_json(path, default):
              try:
                  return json.loads(Path(path).read_text())
              except (OSError, ValueError):
                  return default

          def parse(value):
              return datetime.fromisoformat(value.replace("Z", "+00:00")) if value else None

          def iso(value):
              return value.astimezone(timezone.utc).isoformat() if value else None

          def delta(end, start):
              return round((end - start).total_seconds(), 3) if end and start else None

          run = read_json("workflow-run.json", {})
          created = parse(run.get("created_at"))
          started = parse(run.get("run_started_at"))
          cron = os.environ.get("TRIGGER_CRON", "")
          scheduled = None
          trigger_scheduled = None
          # GitHub exposes the cron expression, not an exact nominal occurrence timestamp.
          # Infer the most recent occurrence using ORIGINAL run creation, never rerun time.
          slots = {"0 12 * * *": (12, 0), "30 13 * * *": (13, 30)}
          if os.environ.get("GITHUB_EVENT_NAME") == "schedule" and created and cron in slots:
              local = created.astimezone(ZoneInfo("Europe/Madrid"))
              hour, minute = slots[cron]
              trigger_scheduled = local.replace(hour=hour, minute=minute, second=0, microsecond=0)
              if trigger_scheduled > local:
                  trigger_scheduled -= timedelta(days=1)
              scheduled = trigger_scheduled.replace(hour=12, minute=0)

          # Read only an artifact from THIS run, never the repository's previous report.
          health = read_json("timing-input/reports/source-health.json", [])
          feed = read_json("timing-input/reports/portfolio-feed.json", {})
          starts = [parse(s["started_at"]) for s in health if s.get("started_at")]
          ends = [parse(s["finished_at"]) for s in health if s.get("finished_at")]
          fetch_start = min(starts) if starts else None
          fetch_end = max(ends) if ends else None
          generated = parse(feed.get("generated_at"))
          commit = parse(os.environ.get("COMMIT_CREATED"))
          pushed = parse(os.environ.get("PUSH_COMPLETED"))
          evidence = {
              "schema_version": 1,
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "run_url": f'https://github.com/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}',
              "event": os.environ["GITHUB_EVENT_NAME"],
              "trigger_cron": cron or None,
              "schedule_timezone": "Europe/Madrid",
              "scheduled_for": iso(scheduled),
              "trigger_scheduled_for": iso(trigger_scheduled),
              "schedule_basis": "inferred most recent cron occurrence; daily target 12:00 Europe/Madrid" if scheduled else "unknown or non-scheduled run",
              "schedule_limitation": "A delay exceeding one day cannot be disambiguated without an external occurrence ID.",
              "workflow_created": iso(created),
              "workflow_actual_start": iso(started),
              "fetch_start": iso(fetch_start),
              "fetch_end": iso(fetch_end),
              "report_generated": iso(generated),
              "commit_created": iso(commit),
              "commit_sha": os.environ.get("COMMIT_SHA") or None,
              "push_completed": iso(pushed),
              "publication_lag_seconds": delta(commit, scheduled),
              "trigger_start_lag_seconds": delta(started, trigger_scheduled),
              "workflow_queue_seconds": delta(started, created),
              "fetch_duration_seconds": delta(fetch_end, fetch_start),
              "run_to_commit_seconds": delta(commit, started),
              "push_lag_seconds": delta(pushed, scheduled),
              "preflight_result": os.environ.get("PREFLIGHT_RESULT"),
              "collect_result": os.environ.get("COLLECT_RESULT"),
              "publish_result": os.environ.get("PUBLISH_RESULT"),
              "dry_run": os.environ.get("DRY_RUN") == "true",
              "measurement_note": "Commit/push timings measure repository publication, not dashboard visibility. Missing milestones remain null.",
          }
          Path("publication-timing.json").write_text(json.dumps(evidence, indent=2) + "\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("### Publication timing evidence\n\n")
              summary.write("| Metric | Value |\n| --- | --- |\n")
              for key, value in evidence.items():
                  summary.write(f"| {key} | {value if value is not None else 'not measured'} |\n")
          PY
      - name: Preserve publication timing
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: publication-timing-${{ github.run_id }}-${{ github.run_attempt }}
          path: publication-timing.json
          if-no-files-found: error
          retention-days: 30

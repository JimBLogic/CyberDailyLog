name: Daily Blue Team Intelligence

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: Lookback hours
        default: "24"
        required: true
      dry_run:
        description: Generate and upload reports without committing them
        type: boolean
        default: true
        required: true

permissions:
  contents: read

concurrency:
  group: cyberdailylog-daily
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    outputs:
      dry_run: ${{ steps.mode.outputs.dry_run }}
    steps:
      - name: Checkout # actions/checkout@v4
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Python # actions/setup-python@v5
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip

      - name: Install application
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Resolve execution mode
        id: mode
        env:
          REQUESTED_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          elif [[ "${REQUESTED_DRY_RUN:-true}" == "true" ]]; then
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run live collection
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          LOOKBACK_HOURS: ${{ github.event.inputs.lookback_hours || '24' }}
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}
        run: |
          if [[ "$DRY_RUN" == "true" ]]; then
            python -m cyberdailylog run --lookback-hours "$LOOKBACK_HOURS"
          else
            python -m cyberdailylog run --lookback-hours "$LOOKBACK_HOURS" --fail-on-degraded
          fi

      - name: Validate generated reports
        run: python -m cyberdailylog validate

      - name: Show source health
        run: cat reports/source-health.json

      - name: Upload reports # actions/upload-artifact@v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reports-${{ github.run_id }}
          path: reports/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: collect
    if: ${{ needs.collect.outputs.dry_run == 'false' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout # actions/checkout@v4
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Download reports # actions/download-artifact@v4
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: reports-${{ github.run_id }}
          path: reports/

      - name: Commit and push changed report files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          if git diff --cached --quiet; then
            echo "No report changes"
            exit 0
          fi
          git commit -m "intel: publish daily blue team digest [skip ci]"
          git push

name: Daily Blue Team Intelligence
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: Lookback hours
        default: "24"
      dry_run:
        description: Generate artifact without committing
        default: "false"
permissions:
  contents: read
concurrency:
  group: cyberdailylog-daily
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    outputs:
      dry_run: ${{ github.event.inputs.dry_run || 'false' }}
    steps:
      - name: Checkout # actions/checkout@v4
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup Python # actions/setup-python@v5
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: { python-version: '3.12' }
      - run: python -m pip install -r requirements.txt
      - name: Run collection
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m cyberdailylog run --lookback-hours "${{ github.event.inputs.lookback_hours || '24' }}" --fail-on-degraded
      - name: Validate
        run: python -m cyberdailylog validate
      - name: Show source health
        run: cat reports/source-health.json
      - name: Upload reports # actions/upload-artifact@v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: { name: reports, path: reports/ }
  publish:
    needs: collect
    if: ${{ needs.collect.outputs.dry_run != 'true' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout # actions/checkout@v4
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Download reports # actions/download-artifact@v4
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { name: reports, path: reports/ }
      - name: Commit and push changed report files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          git diff --cached --quiet && echo "No report changes" || git commit -m "intel: publish daily blue team digest [skip ci]"
          git diff --cached --quiet || true
          git push

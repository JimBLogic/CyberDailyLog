name: Daily Blue Team Intelligence
"on":
  push:
    branches: [main]
    paths: ["src/cyberdailylog/**", "config/**", ".github/workflows/daily-intelligence.yml", "scripts/validate_publication.py", "scripts/verify_publication.py", "scripts/publication_date.py", "ops/scheduler/request.json"]
  schedule:
    - cron: "0 12 * * *"
      timezone: "Europe/Madrid"
    # Off-peak recovery inside the 60-minute objective; preflight prevents duplicate publication.
    - cron: "17 12 * * *"
      timezone: "Europe/Madrid"
    - cron: "30 13 * * *"
      timezone: "Europe/Madrid"
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: Lookback hours
        required: true
        default: "24"
      dry_run:
        description: Preview only; generate and upload reports without publishing
        required: true
        type: boolean
        default: false
      dispatch_requested_at:
        description: Optional UTC timestamp supplied by an independent scheduler
        required: false
        type: string
      trigger_origin:
        description: Trigger origin for timing evidence
        required: false
        type: choice
        options: [manual, external]
        default: manual
permissions:
  contents: read
concurrency:
  group: cyberdailylog-daily
  cancel-in-progress: false
jobs:
  preflight:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.freshness.outputs.should_run }}
      reason: ${{ steps.freshness.outputs.reason }}
    steps:
      - name: Checkout # actions/checkout@v7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: main
          persist-credentials: false
      - name: Check daily publication freshness
        id: freshness
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          should_run="true"
          reason="manual dispatch requested"

          if [ "$INPUT_DRY_RUN" != "true" ]; then
            today="$(TZ=Europe/Madrid date +%F)"
            published_date="$(
              python scripts/publication_date.py \
                2>/dev/null || true
            )"

            if [ "$published_date" = "$today" ] && { [ -f reports/cti-state.json.gz ] || [ -f reports/cti-state.json ]; }; then
              should_run="false"
              reason="a report is already published for $today"
            else
              reason="latest report date is ${published_date:-missing}; collection is required for $today"
            fi
          fi

          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          {
            echo "### Daily automation preflight"
            echo "- Collect: \`$should_run\`"
            echo "- Reason: $reason"
          } >> "$GITHUB_STEP_SUMMARY"
  collect:
    needs: preflight
    if: ${{ needs.preflight.outputs.should_run == 'true' }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      dry_run: ${{ steps.mode.outputs.dry_run }}
    steps:
      - name: Checkout # actions/checkout@v7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: main
          persist-credentials: false
      - name: Setup Python # actions/setup-python@v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Resolve execution mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_LOOKBACK_HOURS: ${{ inputs.lookback_hours }}
        run: |
          set -euo pipefail
          lookback_hours="${INPUT_LOOKBACK_HOURS:-24}"
          case "$lookback_hours" in
            ''|*[!0-9]*) echo "lookback_hours must be a positive integer" >&2; exit 2 ;;
          esac
          if [ "$lookback_hours" -le 0 ] || [ "$lookback_hours" -gt 168 ]; then
            echo "lookback_hours must be a positive integer" >&2
            exit 2
          fi
          if [ "$EVENT_NAME" = "schedule" ] || [ "$EVENT_NAME" = "push" ]; then
            dry_run="false"
          elif [ "$INPUT_DRY_RUN" = "true" ]; then
            dry_run="true"
          elif [ "$INPUT_DRY_RUN" = "false" ]; then
            dry_run="false"
          else
            echo "dry_run must resolve to true or false" >&2
            exit 2
          fi
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"
          echo "lookback_hours=$lookback_hours" >> "$GITHUB_OUTPUT"
      - name: Install application
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Run collection
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          LOOKBACK_HOURS: ${{ steps.mode.outputs.lookback_hours }}
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            python -m cyberdailylog run --lookback-hours "$LOOKBACK_HOURS" --dry-run
          else
            python -m cyberdailylog run --lookback-hours "$LOOKBACK_HOURS" --fail-on-degraded
          fi
      - name: Generate compact portfolio feed
        run: python -m cyberdailylog.portfolio_feed
      - name: Generate dashboard history feed
        run: python -m cyberdailylog.dashboard_feed
      - name: Update repository landing snapshot
        run: python -m cyberdailylog.readme_snapshot
      - name: Validate reports
        run: python -m cyberdailylog validate
      - name: Validate public outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          feed = json.loads(Path("reports/portfolio-feed.json").read_text(encoding="utf-8"))
          dashboard = json.loads(Path("reports/dashboard-feed.json").read_text(encoding="utf-8"))
          assert feed["schema_version"] == 1
          assert feed["schema_url"].endswith("schemas/portfolio-feed.schema.json")
          assert feed["endpoints"]["schema"] == feed["schema_url"]
          assert feed["project"] == "CyberDailyLog"
          assert feed["pipeline_status"] in {"operational", "degraded"}
          assert len(feed["top_vulnerabilities"]) <= 5
          assert all(0 <= item["priority_score"] <= 10 for item in feed["top_vulnerabilities"])
          assert dashboard["schema_version"] == 1
          assert dashboard["project"] == "CyberDailyLog"
          assert dashboard["generated_at"] == feed["generated_at"]
          assert 1 <= len(dashboard["history"]) <= 30
          assert dashboard["history"][-1]["date"] == feed["generated_at"][:10]

          readme = Path("README.md").read_text(encoding="utf-8")
          assert "<!-- CYBERDAILYLOG:DAILY:START -->" in readme
          assert feed["generated_at"] in readme
          PY
      - name: Show source health
        run: cat reports/source-health.json
      - name: Stage bounded publication artifact
        run: |
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          from cyberdailylog.state import StateLedger, write_state
          root = Path("publication-output")
          (root / "reports").mkdir(parents=True, exist_ok=True)
          shutil.copy2("README.md", root / "README.md")
          for name in ("latest.md", "latest.json", "source-health.json", "portfolio-feed.json", "dashboard-feed.json", "pipeline-metrics.json"):
              source = Path("reports") / name
              if source.exists():
                  shutil.copy2(source, root / source)
          # Dry runs can still start from a legacy JSON baseline. Compress only
          # the artifact copy, without advancing or rewriting that baseline.
          state_path = Path("reports/cti-state.json.gz")
          if state_path.exists():
              shutil.copy2(state_path, root / state_path)
          elif state_path.with_suffix("").exists():
              write_state(root / state_path, StateLedger(state_path).data)
          date = json.loads(Path("reports/latest.json").read_text())["coverage_end"][:10]
          folder = Path("reports/archive") / date[:4] / date[5:7]
          (root / folder).mkdir(parents=True, exist_ok=True)
          for source in folder.glob(date + "*"):
              shutil.copy2(source, root / source)
          PY
      - name: Check artifact file sizes
        run: python scripts/validate_publication.py --root publication-output
      - name: Bind the complete report bundle
        run: python scripts/verify_publication.py --root publication-output --write-manifest
      - name: Upload generated outputs # actions/upload-artifact@v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: reports-${{ github.run_id }}
          path: publication-output/
          if-no-files-found: error
          retention-days: 7
  publish:
    outputs:
      commit_sha: ${{ steps.publication.outputs.commit_sha }}
      commit_created: ${{ steps.publication.outputs.commit_created }}
      push_completed: ${{ steps.publication.outputs.push_completed }}
      duplicate_close: ${{ steps.publication.outputs.duplicate_close }}
    needs: collect
    if: ${{ needs.collect.outputs.dry_run == 'false' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout main # actions/checkout@v7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: main
      - name: Download generated outputs # actions/download-artifact@v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: reports-${{ github.run_id }}
          path: incoming-publication
      - name: Verify bundle and historical integrity against current main
        run: |
          set -euo pipefail
          python scripts/verify_publication.py --root incoming-publication --baseline-ref HEAD --evidence publication-check.json
      - name: Commit and push generated outputs
        id: publication
        run: |
          set -euo pipefail
          if python -c 'import json,sys; sys.exit(0 if json.load(open("publication-check.json"))["duplicate_close"] else 1)'; then
            echo "Complete daily close already exists; this recovery cannot replace it"
            echo "duplicate_close=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cp incoming-publication/README.md README.md
          cp -a incoming-publication/reports/. reports/
          # Regenerate only the dynamic block against the current README.
          # The collection artifact may predate an intervening documentation edit.
          git restore --source=HEAD -- README.md
          python src/cyberdailylog/readme_snapshot.py
          # Artifact downloads cannot represent deletion of the old baseline.
          # Collection has already validated its complete gzip replacement.
          if [ ! -f reports/cti-state.json.gz ]; then
            echo "Missing compressed CTI baseline; refusing to publish" >&2
            exit 1
          fi
          rm -f reports/cti-state.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md reports
          python scripts/validate_publication.py --staged

          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi

          git commit -m "intel: publish daily blue team digest [skip ci]"
          bash scripts/push_publication.sh

  timing:
    name: Publication timing evidence
    needs: [preflight, collect, publish]
    # Keep evidence for late/skipped recoveries without rerunning collection.
    if: ${{ always() && inputs.dry_run != true && github.ref == 'refs/heads/main' }}
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout published main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: main
      - name: Download this run's reports
        if: ${{ needs.collect.result == 'success' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: reports-${{ github.run_id }}
          path: timing-input
      - name: Read workflow timing from GitHub
        id: read_timing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > workflow-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" > workflow-jobs.json
      - name: Calculate and publish timing evidence
        if: ${{ always() }}
        env:
          TIMING_CAN_PUBLISH: ${{ steps.read_timing.outcome == 'success' }}
          TRIGGER_CRON: ${{ github.event.schedule }}
          # The connected external scheduler can publish one request file without a PAT.
          # Use GitHub's immutable push commit timestamp, not a moving file on main.
          TRIGGER_ORIGIN: >-
            ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'ops: request daily publication') && 'external_push' || inputs.trigger_origin }}
          DISPATCH_REQUESTED_AT: >-
            ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'ops: request daily publication') && github.event.head_commit.timestamp || inputs.dispatch_requested_at }}
          PREFLIGHT_SHOULD_RUN: ${{ needs.preflight.outputs.should_run }}
          PREFLIGHT_REASON: ${{ needs.preflight.outputs.reason }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          COLLECT_RESULT: ${{ needs.collect.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          PUBLISH_DUPLICATE_CLOSE: ${{ needs.publish.outputs.duplicate_close }}
          DRY_RUN: ${{ needs.collect.outputs.dry_run }}
          COMMIT_SHA: ${{ needs.publish.outputs.commit_sha }}
          COMMIT_CREATED: ${{ needs.publish.outputs.commit_created }}
          PUSH_COMPLETED: ${{ needs.publish.outputs.push_completed }}
        run: |
          bash scripts/publish_timing.sh \
            --run workflow-run.json \
            --health timing-input/reports/source-health.json \
            --feed timing-input/reports/portfolio-feed.json \
            --output reports/publication-timing.json \
            --history reports/publication-timing-history.json \
            --jobs workflow-jobs.json \
            --metrics timing-input/reports/pipeline-metrics.json
      - name: Preserve publication timing
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: publication-timing-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/publication-timing.json
          if-no-files-found: error
          retention-days: 30

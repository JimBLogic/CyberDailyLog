name: Daily Blue Team Intelligence
"on":
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: Lookback hours
        required: true
        default: "24"
      dry_run:
        description: Generate and upload reports without publishing them
        required: true
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: cyberdailylog-daily
  cancel-in-progress: false
jobs:
  collect:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      dry_run: ${{ steps.mode.outputs.dry_run }}
    steps:
      - name: Checkout # actions/checkout@v4
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup Python # actions/setup-python@v5
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Resolve execution mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_LOOKBACK_HOURS: ${{ inputs.lookback_hours }}
        run: |
          set -euo pipefail
          lookback_hours="${INPUT_LOOKBACK_HOURS:-24}"
          case "$lookback_hours" in
            ''|*[!0-9]*) echo "lookback_hours must be a positive integer" >&2; exit 2 ;;
          esac
          if [ "$lookback_hours" -le 0 ]; then
            echo "lookback_hours must be a positive integer" >&2
            exit 2
          fi
          if [ "$EVENT_NAME" = "schedule" ]; then
            dry_run="false"
          elif [ "$INPUT_DRY_RUN" = "true" ]; then
            dry_run="true"
          elif [ "$INPUT_DRY_RUN" = "false" ]; then
            dry_run="false"
          else
            echo "dry_run must resolve to true or false" >&2
            exit 2
          fi
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"
          echo "lookback_hours=$lookback_hours" >> "$GITHUB_OUTPUT"
      - name: Install application
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Run collection
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          LOOKBACK_HOURS: ${{ steps.mode.outputs.lookback_hours }}
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            python -m cyberdailylog run --lookback-hours "$LOOKBACK_HOURS"
          else
            python -m cyberdailylog run --lookback-hours "$LOOKBACK_HOURS" --fail-on-degraded
          fi
      - name: Generate compact portfolio feed
        run: python -m cyberdailylog.portfolio_feed
      - name: Validate reports
        run: python -m cyberdailylog validate
      - name: Validate portfolio feed
        run: |
          python - <<'PY'
          import json

          feed = json.loads(open('reports/portfolio-feed.json', encoding='utf-8').read())
          assert feed['schema_version'] == 1
          assert feed['project'] == 'CyberDailyLog'
          assert isinstance(feed['top_vulnerabilities'], list)
          assert len(feed['top_vulnerabilities']) <= 5
          PY
      - name: Show source health
        run: cat reports/source-health.json
      - name: Upload reports # actions/upload-artifact@v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reports-${{ github.run_id }}
          path: reports/
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: collect
    if: ${{ needs.collect.outputs.dry_run == 'false' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main # actions/checkout@v4
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
      - name: Download reports # actions/download-artifact@v4
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: reports-${{ github.run_id }}
          path: reports/
      - name: Commit and push changed report files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports

          if git diff --cached --quiet; then
            echo "No report changes"
            exit 0
          fi

          git commit -m "intel: publish daily blue team digest [skip ci]"
          git push

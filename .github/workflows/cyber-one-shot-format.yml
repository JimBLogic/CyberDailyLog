name: One-shot CyberDailyLog audited Ruff format (no deployment)

"on":
  push:
    branches: [audit/security-patches-20261015]
    paths: [security/format-request.txt]
permissions:
  contents: read
jobs:
  format:
    if: ${{ github.repository == 'JimBLogic/CyberDailyLog' && github.ref == 'refs/heads/audit/security-patches-20261015' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: audit/security-patches-20261015
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install exact repo formatter
        run: python -m pip install --disable-pip-version-check ruff==0.12.10
      - name: Reformat exactly the two reviewed CTI HTTP files
        run: |
          ruff format src/cyberdailylog/http.py tests/unit/test_safe_http.py
          ruff check src/cyberdailylog/http.py tests/unit/test_safe_http.py
          git diff --check
          git status --short
      - name: Commit formatting-only changes on isolated branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/cyberdailylog/http.py tests/unit/test_safe_http.py
          if git diff --cached --quiet; then exit 0; fi
          test "$(git diff --cached --name-only)" = "$(printf '%s\n' src/cyberdailylog/http.py tests/unit/test_safe_http.py)"
          git commit -m "style(cti): conform security HTTP guard and tests to pinned Ruff formatter [skip ci]"
          git push origin HEAD:refs/heads/audit/security-patches-20261015

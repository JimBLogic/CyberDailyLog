name: CSV-to-MD
on:
  push:
    paths:
      - daily-log.csv

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Convert CSV to Markdown
        run: |
          python3 -c "
          import csv
          with open('daily-log.csv') as f:
              reader = csv.reader(f)
              rows = list(reader)
          
          header = rows[0]
          lines = ['| ' + ' | '.join(header) + ' |', '|---'*len(header) + '|']
          for r in rows[1:]:
              lines.append('| ' + ' | '.join(r) + ' |')
          
          with open('log.md', 'w') as out:
              out.write('\n'.join(lines))
          "
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          keep_files: false

name: One-shot isolated CyberDailyLog build-tool lockfile patch

"on":
  push:
    branches: [audit/security-patches-20261015]
    paths: [security/buildtools-request.txt]
permissions:
  contents: read
jobs:
  patch-lockfile:
    if: ${{ github.repository == 'JimBLogic/CyberDailyLog' && github.ref == 'refs/heads/audit/security-patches-20261015' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: audit/security-patches-20261015
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.13.0'
          package-manager-cache: false
      - name: Verify exact authorized versions
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          if(p.devDependencies['@cloudflare/vite-plugin']!=='1.64.0'||
             p.devDependencies.wrangler!=='4.151.0'||
             p.dependencies.next!=='16.4.1'||
             p.overrides.sharp!=='0.35.5'||
             p.overrides['source-map-js']!=='1.2.2')throw new Error('Unexpected dashboard pins');
          NODE
      - name: Recreate lockfile from exactly reviewed manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate build-tool lockfile versions and production audit
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          const expect={'next':'16.4.1','sharp':'0.35.5','source-map-js':'1.2.2','@cloudflare/vite-plugin':'1.64.0','wrangler':'4.151.0'};
          for(const [name,v] of Object.entries(expect)){
            const got=lock.packages['node_modules/'+name]?.version;
            if(got!==v)throw new Error(name+': expected '+v+' got '+got);
          }
          NODE
          npm audit --omit=dev --audit-level=low
      - name: Commit strictly lockfile change to isolated branch
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json
          test "$(git diff --cached --name-only)" = "dashboard/package-lock.json"
          git commit -m "fix(deps-dev): lock patched Cloudflare plugin and Wrangler [skip ci]"
          git push origin HEAD:refs/heads/audit/security-patches-20261015

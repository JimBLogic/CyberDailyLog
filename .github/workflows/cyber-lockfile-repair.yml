name: Isolated CyberDailyLog dashboard lockfile repair (no deployment)

"on":
  push:
    branches:
      - audit/security-patches-20261015
    paths:
      - security/dashboard-lockfile-request.txt

permissions:
  contents: read

jobs:
  lockfile-repair:
    if: ${{ github.repository == 'JimBLogic/CyberDailyLog' && github.ref == 'refs/heads/audit/security-patches-20261015' && github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout isolated security branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: audit/security-patches-20261015
          persist-credentials: true
      - name: Node 22 (current Sites runtime compatibility)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.13.0'
          package-manager-cache: false
      - name: Verify owner-reviewed precise patch versions
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const p = JSON.parse(fs.readFileSync('package.json'));
          if (p.dependencies.next !== '16.4.1' ||
              p.devDependencies['eslint-config-next'] !== '16.4.1' ||
              p.overrides.sharp !== '0.35.5' ||
              p.overrides['source-map-js'] !== '1.2.2') {
            throw new Error('Refusing to update unexpected dashboard dependencies');
          }
          NODE
      - name: Recreate locked package metadata safely without npm install scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify all pinned patch versions resolved in lockfile
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const data = JSON.parse(fs.readFileSync('package-lock.json'));
          const versions = {next:'16.4.1','eslint-config-next':'16.4.1',sharp:'0.35.5','source-map-js':'1.2.2'};
          for(const [name, version] of Object.entries(versions)){
            const actual = data.packages['node_modules/'+name]?.version;
            if(actual!==version) throw new Error(name+' expected '+version+' got '+actual);
          }
          const primary = data.packages[''];
          if(primary.dependencies.next!=='16.4.1' ||
             primary.devDependencies['eslint-config-next']!=='16.4.1')throw new Error('Lockfile root disagrees');
          console.log('PATCHED_LOCKFILE', versions);
          NODE
      - name: Zero-waiver production package vulnerability check
        run: npm audit --omit=dev --audit-level=high
      - name: Verify clean diff before commit
        run: git diff --check && git status --short -- package.json package-lock.json
      - name: Commit ONLY updated dependency lockfile to isolated branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json
          git diff --cached --quiet && { echo "No lockfile change"; exit 0; }
          test "$(git diff --cached --name-only)" = "dashboard/package-lock.json"
          git commit -m "fix(deps): lock patched Next, sharp and source-map-js [skip ci]"
          git push origin HEAD:refs/heads/audit/security-patches-20261015

name: Mypy Diagnostics

"on":
  pull_request:

permissions:
  contents: read

jobs:
  mypy-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install .
          python -m pip install -r requirements-dev.txt
      - name: Capture mypy diagnostics
        run: |
          set +e
          mypy src > mypy-diagnostics.txt 2>&1
          status=$?
          set -e
          cat mypy-diagnostics.txt
          echo "exit_status=$status" >> mypy-diagnostics.txt
          test "$status" -ne 0
      - name: Upload diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mypy-diagnostics-${{ github.run_id }}
          path: mypy-diagnostics.txt
          if-no-files-found: error
          retention-days: 1

name: Mobile published-site QA
"on":
  workflow_dispatch:
  pull_request:
    paths:
      - 'qa/mobile/**'
      - '.github/workflows/mobile-qa.yml'
  push:
    branches: [main]
    paths:
      - 'qa/mobile/**'
      - '.github/workflows/mobile-qa.yml'
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: qa/mobile
    steps:
      - name: Checkout test harness
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
      - name: Install locked test dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium and system dependencies
        run: npx --no-install playwright install --with-deps chromium
      - name: Test published Site with touch and mobile viewports
        run: npm test
      - name: Preserve screenshots and reports, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mobile-published-site-evidence
          path: |
            qa/mobile/playwright-report/
            qa/mobile/test-results/
          retention-days: 14
          if-no-files-found: error

name: Temporary CTI formatter (branch only)
on:
  push:
    branches:
      - fix/kev-dates-ahsay-change-intelligence-20261016
    paths:
      - .github/workflows/ci-ruff-format-once-20261016.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout only isolated PR branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/kev-dates-ahsay-change-intelligence-20261016
          persist-credentials: true
      - name: Pin ruff and format two changed Python files
        run: |
          python -m pip install --no-input 'ruff==0.12.10'
          ruff format src/cyberdailylog/operational_evidence.py tests/unit/test_kev_october2026.py
          ruff check src/cyberdailylog/operational_evidence.py tests/unit/test_kev_october2026.py
          git diff --check
      - name: Commit formatter output to isolated PR branch
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "fix/kev-dates-ahsay-change-intelligence-20261016"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/cyberdailylog/operational_evidence.py tests/unit/test_kev_october2026.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'style(cti): apply pinned ruff formatter to regression'
          git push origin HEAD:fix/kev-dates-ahsay-change-intelligence-20261016
